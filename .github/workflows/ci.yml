name: CI
on:
  pull_request:
  push:
    branches: [redesign-sandow]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Sem package-lock.json, `npm ci` falha (EUSAGE); nesse caso cai para `npm install`.
      - name: Instalar dependências
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Publicar package-lock.json
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: warn
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
